}

    <h1>Ruleta fizivision</h1>
    <div class="masina-petrecere" id="masina-petrecere">
        <div class="petrecere" id="petrecere1">❓</div>
        <div class="petrecere" id="petrecere2">❓</div>
        <div class="petrecere" id="petrecere3">❓</div>
    </div>
    <button style="display: block;margin: auto;" class="button" onclick="spin()">Apasa</button>
    <h1>Vorbește cu Fizivison</h1>
<div class="container-chat" id="chat" >
        
    <div class="antet-chat">Fizivision</div>
    <img style="width:20%;height:20%" src="Fv.png">
    <div class="mesaje-chat" id="mesajeChat">
        <div class="mesaj primit">Salut! Eu sunt Fizivision. Despre ce vrei să vorbim?</div>
    </div>
    
    <div class="butoane-chat">
        <button style="height:45px;width:130px;" onclick="alegeSubiect('mecanica')">Mecanică</button>
        <button style="height:45px;width:130px;" onclick="alegeSubiect('termodinamica')">Termodinamică</button>
        <button style="height:45px;width:130px;" onclick="alegeSubiect('optica')">Optică</button>
        <button style="height:45px;width:130px;" onclick="alegeSubiect('electricitate')">Electricitate</button>
    </div>
    
    <div class="intrari-chat">
        <input type="text" id="intrareMesaj" placeholder="Scrie un mesaj...">
        <button style="height:45px;width:130px;" onclick="trimiteMesaj()">Trimite</button>
    </div>
</div>
<script>
            const symbols = [' 🧠 ', ' 🌟 ', ' 💡 ', ' 🌌 ', ' 🪐 ', '🔭 '];
        
        function spin() {
            document.getElementById('petrecere1').textContent = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('petrecere2').textContent = symbols[Math.floor(Math.random() * symbols.length)];
            document.getElementById('petrecere3').textContent = symbols[Math.floor(Math.random() * symbols.length)];
        }
    let index = 1;
    Apare(index);
    function inainte(n)
    {
        index +=n;
        Apare(index);
    }
    function Apare(n){
        const imaginii = document.getElementsByClassName('img');
        if(n>imaginii.length) index=1;
        if(n<1)index=imaginii.length;
        for(let i=0;i<imaginii.length;i++)
    {
        imaginii[i].style.display="none";
    }
    imaginii[index-1].style.display = "block";
    }
        addEventListener("resize" , e );
    addEventListener("resize" , f );
    addEventListener("resize" , g );
    addEventListener("resize" , h );
    addEventListener("resize" , i );
    addEventListener("resize" , j );


    function e(){
    let n = Math.floor(Math.random()*100);
    document.getElementById('demo').innerHTML = n;
    }
        function f(){
    let m= Math.floor(Math.random()*100);
    document.getElementById('demo1').innerHTML = m;
    }
        function g(){
    let p = Math.floor(Math.random()*100);
    document.getElementById('demo2').innerHTML = p;
    }
            function h(){
    let h= Math.floor(Math.random()*100);
    document.getElementById('demo3').innerHTML = h;
    }
            function i(){
    let i = Math.floor(Math.random()*100);
    document.getElementById('demo4').innerHTML = i;
    }
            function j(){
    let j = Math.floor(Math.random()*100);
    document.getElementById('demo5').innerHTML = j;
    }
      let subiectCurent = null;
    let ultimulRaspuns = "";

    function alegeSubiect(subiect) {
        subiectCurent = subiect;
        ultimulRaspuns = "";
        adaugaMesajFizivision(`Am selectat subiectul: ${subiect.charAt(0).toUpperCase() + subiect.slice(1)}`);
    }

    function trimiteMesaj() {
        const input = document.getElementById('intrareMesaj');
        const textMesaj = input.value.trim();
        if (textMesaj === '' || subiectCurent === null) return;

        const containerMesaje = document.getElementById('mesajeChat');

        const mesajUser = document.createElement('div');
        mesajUser.classList.add('mesaj', 'trimis');
        mesajUser.innerText = textMesaj;

        containerMesaje.appendChild(mesajUser);
        input.value = '';

        containerMesaje.scrollTop = containerMesaje.scrollHeight;

        setTimeout(() => {
            genereazaRaspuns(textMesaj);
        }, 1000);
    }

    function adaugaMesajFizivision(text) {
        const containerMesaje = document.getElementById('mesajeChat');

        const mesajFizivision = document.createElement('div');
        mesajFizivision.classList.add('mesaj', 'primit');
        mesajFizivision.innerText = text;

        containerMesaje.appendChild(mesajFizivision);
        containerMesaje.scrollTop = containerMesaje.scrollHeight;
    }

    function genereazaRaspuns(mesaj) {
        mesaj = mesaj.toLowerCase();
        let raspuns = "";

        if (subiectCurent === 'mecanica') {
            if (mesaj.includes('forta') || mesaj.includes('viteza')) {
                raspuns = 'În mecanică, forța este o mărime fizică ce produce schimbarea stării de mișcare sau de formă a unui corp. Vrei să discutăm despre legile lui Newton?';
            } else if (mesaj.includes('energie')) {
                raspuns = 'Energia mecanică poate fi de mai multe tipuri: cinetică, potențială gravitațională sau elastică. Vrei să îți explic fiecare tip?';
            } else {
                raspuns = 'Despre mecanică? Pot să îți explic despre forțe, energie, legile mișcării sau orice altceva. Ce te interesează mai exact?';
            }
        } 
        else if (subiectCurent === 'termodinamica') {
            if (mesaj.includes('caldura') || mesaj.includes('temperatura')) {
                raspuns = 'În termodinamică, căldura este transferul de energie între două corpuri datorită diferenței de temperatură. Vrei să îți explic legea lui Fourier?';
            } else if (mesaj.includes('legi')) {
                raspuns = 'Termodinamica se bazează pe patru legi fundamentale. Vrei să începem cu legea zero a termodinamicii?';
            } else {
                raspuns = 'Vrei să discutăm despre legi, căldură, lucrul mecanic sau alte concepte din termodinamică? Ce vrei să știi?';
            }
        } 
        else if (subiectCurent === 'optica') {
            if (mesaj.includes('lumina') || mesaj.includes('lentile')) {
                raspuns = 'Optica studiază proprietățile luminii și modul în care aceasta interacționează cu diferite materiale. Vrei să îți explic despre reflexie și refracție?';
            } else if (mesaj.includes('culoare')) {
                raspuns = 'Culoarea este percepută datorită lungimilor de undă diferite ale luminii. Vrei să știi mai multe despre spectrul electromagnetic?';
            } else {
                raspuns = 'Despre optică? Pot să îți explic despre reflexie, refracție, lentile, culori și multe altele. Ce subiect te interesează?';
            }
        } 
        else if (subiectCurent === 'electricitate') {
            if (mesaj.includes('curent') || mesaj.includes('tensiune')) {
                raspuns = 'Curentul electric este un flux de sarcini electrice, iar tensiunea este diferența de potențial electric între două puncte. Vrei să îți explic Legea lui Ohm?';
            } else if (mesaj.includes('circuite')) {
                raspuns = 'Circuitele electrice pot fi serii sau paralele. Vrei să îți explic diferențele dintre ele?';
            } else {
                raspuns = 'Despre electricitate? Pot să îți explic despre curent, tensiune, rezistență, circuite și multe altele. Ce dorești să afli?';
            }
        } else {
            raspuns = 'Te rog să selectezi mai întâi un subiect: Mecanică, Termodinamică, Optică sau Electricitate.';
        }

        if (raspuns !== ultimulRaspuns) {
            adaugaMesajFizivision(raspuns);
            ultimulRaspuns = raspuns;
        }
    }
</script>
